# 회사 어휘 사전 — **검색 매칭 전용.**
#
# 한 줄이 동의어 묶음이고 방향이 없다. 질의에 어느 표기든 나오면 나머지가 함께
# 검색어가 된다. 여러 낱말은 구(句)로 들어간다 — 'OT payment request' 는 붙어 있는
# 세 낱말을 찾으므로 'request' 가 홀로 검색어가 되지 않는다.
# 활용형은 따로 적는다 (approval / approve / approved) — 색인이 'simple' 사전이라
# 어간을 자르지 않아 셋이 서로 다른 토큰이다.
# 뜻을 확인한 표기만 적는다. 틀린 확장은 엉뚱한 조항을 근거로 끌어올린다.

groups:
  # ── 출장 ─────────────────────────────────────────
  - [출장, business trip, biz trip, công tác]
  - [일비, daily allowance, per diem, phụ cấp]
  - [숙박비, 호텔비, accommodation, tiền phòng]
  - [교통비, transportation, chi phí đi lại]

  # ── 근태·수당 ────────────────────────────────────
  - [식대, 중식대, meal allowance, tiền ăn]
  - [야근, 시간외근무, OT, overtime, làm thêm giờ]
  - [연차, 유급휴가, annual leave, AL, nghỉ phép]

  # ── 결재 흐름 ────────────────────────────────────
  # 직원이 쓰는 말과 문서의 표현이 다르다 (직원은 'OTPR', 문서는 'overtime payment').
  # 약어는 M365 TF 채팅방에 정의가 적힌 것 + 담당자가 확인해 준 것만 적는다.
  #   "OT payment request(OTPR)" · "OT plan (OTP)" · "performance Bonus(PB)"
  #   "AL Balance ... Annual Leave"
  #   PR / PPL / PMR 은 담당자 확인 (2026-08-27). 방에서는 PPL 을 'PL' 로도 쓴다.
  - [승인, 결재, approval, approve, approved, phê duyệt, duyệt]
  - [승인자, 결재자, approver, người phê duyệt]
  - [요청자, 기안자, requester, người làm đơn]
  - [반려, reject, rejected, từ chối]
  - [지급, 정산, payment, thanh toán, tt]
  - [OTP, OT plan, OTPL]
  - [OTPR, OT payment request]
  - [PR, purchase request, 구매요청]
  - [PPL, PL, purchasing plan, 구매계획]
  - [PMR, payment request, 지급요청]

  # ── 조직 ─────────────────────────────────────────
  - [BO, business operation]
  - [어드민, admin]
  - [인프라팀, 인프라, BD Infra]
  - [엔지니어링, 엔지니어, engineering]
  - [웨어하우스, warehouse]

  # ── 증빙 ─────────────────────────────────────────
  - [세금계산서, 적격증빙, red invoice, hóa đơn đỏ, hóa đơn VAT]
  - [법인장, General Director, Tổng Giám đốc, TGD, TGĐ]

  # ── 인사·노무 (베트남 노동법 표준 용어) ──────────────
  # 앞의 묶음들과 출처가 다르다. 위쪽은 우리 방·담당자에게서 나온 사내 표기이고,
  # 여기는 베트남 노동법(2019)과 그 한국어 번역에서 쓰는 **표준 용어**다. 사규가
  # 법을 인용하거나 베껴 쓰는 자리가 많아서, 직원이 한국어로 묻는 개념이 문서에는
  # 법률 표기로 적혀 있는 경우가 흔하다.
  #
  # ★ 우리 코퍼스에 없는 개념도 섞여 있을 수 있다. 그건 무해하다 — 없는 표기는
  #   어휘 갈래가 못 찾을 뿐 엉뚱한 것을 끌어오지 않는다. 반대로 틀린 짝은 해로우니
  #   법령에서 쓰는 표기만 적는다.
  # ★ 베트남어 약어를 같이 적는다. 실무 문서는 BHXH·HĐLĐ 처럼 약어로 적는 일이 많다.
  - [근로계약, 노동계약, labor contract, labour contract, hợp đồng lao động, HĐLĐ]
  - [수습, 시용, probation, thử việc]
  - [취업규칙, 사규, 내부규정, internal labor regulations, nội quy lao động]
  - [단체협약, collective labour agreement, thỏa ước lao động tập thể]
  - [사회보험, social insurance, bảo hiểm xã hội, BHXH]
  - [건강보험, 의료보험, health insurance, bảo hiểm y tế, BHYT]
  - [실업보험, unemployment insurance, bảo hiểm thất nghiệp, BHTN]
  - [퇴직금, 퇴직수당, severance allowance, trợ cấp thôi việc]
  - [해지, 해고, termination, chấm dứt hợp đồng]
  - [징계, disciplinary, kỷ luật lao động]
  - [노동조합, trade union, công đoàn]
  - [급여, 임금, salary, wage, lương]
  - [급여명세서, payslip, phiếu lương]
  - [소득세, 개인소득세, personal income tax, PIT, thuế thu nhập cá nhân, thuế TNCN]
  - [근태, 출퇴근, timekeeping, attendance, chấm công]
  - [병가, sick leave, nghỉ ốm]
  - [출산휴가, maternity leave, nghỉ thai sản]
  - [경조휴가, personal leave, nghỉ việc riêng]
  - [무급휴가, unpaid leave, nghỉ không lương]
  - [상여, 보너스, bonus, thưởng]
  - [설 상여, 뗏 보너스, Tet bonus, thưởng Tết, lương tháng 13]
  - [노동허가서, work permit, giấy phép lao động]
  - [거주증, temporary residence card, thẻ tạm trú]
  - [산업안전, 안전보건, occupational safety, an toàn lao động]
