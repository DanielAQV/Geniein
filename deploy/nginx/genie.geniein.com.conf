# 유나 Teams 탭 — genie.geniein.com
#
# 설치: /etc/nginx/sites-available/genie 로 복사 후 sites-enabled 에 링크.
# 홈페이지(geniein.com → :3000)와 **완전히 별개인 블록**이다. nginx 가 server_name
# 으로 갈라주므로 서로 간섭하지 않는다. sites-available/default 는 건드리지 않는다.
#
# ★ add_header 를 쓰지 않는다.
#   보안 헤더와 CSP 는 Next 앱이 경로별로 만든다 (/teams 만 Teams 프레임 허용,
#   나머지는 frame-ancestors 'self'). nginx 가 CSP 를 하나 더 붙이면 헤더가 두 벌이
#   되고 브라우저는 **둘 다** 만족시켜야 해서 교집합이 좁아져 조용히 막힌다.
#   또 한 컨텍스트에서 add_header 를 하나라도 쓰면 상위 컨텍스트의 add_header 가
#   전부 무시된다.
#
# ★ location /api/ 를 만들지 않는다.
#   홈페이지 블록에는 `location /api/ → :3001 (NestJS)` 가 있지만, 우리 BFF 는
#   **Next 앱 안에 있는** /api/teams/search 다. 그 규칙을 여기 옮겨 붙이면 탭의
#   검색 요청이 NestJS 로 새서 404 가 난다.
#
# TLS 는 certbot 이 이 블록에 직접 써 넣는다:
#   sudo certbot --nginx -d genie.geniein.com

server {
    listen 80;

    server_name genie.geniein.com;

    location / {
        proxy_pass http://127.0.0.1:3100;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 뇌가 도구 연쇄 + LLM 을 도는 동안 응답이 수십 초 걸린다.
        # nginx 기본 60s 면 답이 오기 전에 끊긴다.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
