# geniein.com (홈페이지) nginx 블록.
#
# ★ 핵심: /api/ 아래에 **두 개의 서로 다른 서버**가 산다.
#
#     Next BFF   (:3000)  /api/auth/·/api/admin/·/api/teams/·/api/contact·/api/careers/apply
#     NestJS API (:3001)  /api/careers·/api/insights·/api/agent
#
#   `location /api/ → :3001/` 하나만 두면 Next BFF 전체가 NestJS 로 새고,
#   NestJS 에는 그런 라우트가 없으니 404 가 돌아온다. 관리자 로그인 화면은
#   429·503 이 아닌 응답을 전부 "Invalid username or password" 로 표시하므로
#   (admin/login/page.tsx) 비밀번호 문제로 보이지만, 실제로는 요청이 Next 에
#   도착조차 하지 않은 상태다. 실제로 이 증상으로 한참 헤맸다.
#
# ★ Next BFF 블록의 proxy_pass 에는 **끝 슬래시를 붙이지 않는다.**
#     proxy_pass http://127.0.0.1:3000;   → /api/auth/login 을 그대로 넘긴다  (맞음)
#     proxy_pass http://127.0.0.1:3000/;  → /api/ 를 떼서 /auth/login 을 넘긴다 (틀림)
#   NestJS 블록은 반대다. Nest 컨트롤러가 @Controller('careers') 라 prefix 가
#   없으므로 끝 슬래시로 /api/ 를 떼서 넘겨야 한다.
#
# ★ `^~` 를 쓰는 이유. prefix 매칭은 가장 긴 것이 이기므로 `^~` 없이도 분기는
#   되지만, `^~` 는 정규식 location 을 아예 건너뛴다. 나중에 누가 `location ~
#   \.(js|css)$` 같은 걸 추가해도 BFF 경로가 그쪽으로 끌려가지 않는다.
#
# ★ 프록시 헤더를 반드시 넘긴다. Next 의 로그인 레이트 리미터가
#   x-forwarded-for → x-real-ip 순으로 클라이언트를 식별하고
#   (lib/auth/rate-limit.ts 의 clientKey), 둘 다 없으면 'unknown' 하나로
#   묶는다. 그러면 15분/10회 제한이 전 세계 공용이 된다.
#
# TLS 는 certbot 이 이 블록에 직접 써 넣는다:
#   sudo certbot --nginx -d geniein.com -d www.geniein.com

server {
    listen 80;
    listen [::]:80;

    server_name geniein.com www.geniein.com;

    # ── Next BFF (:3000) ────────────────────────────────
    # /api/ 보다 긴 prefix 라 아래 NestJS 블록보다 먼저 매칭된다.
    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/admin/ {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/contact {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api/careers (NestJS 공고 목록) 과 겹치지만 더 긴 prefix 라 이긴다.
    location ^~ /api/careers/apply {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 이력서 첨부가 올라온다. 기본 1m 로는 막힌다.
        client_max_body_size 15m;
    }

    # /api/teams/search/stream 이 SSE 다. 버퍼링을 끄고 타임아웃을 늘린다.
    location ^~ /api/teams/ {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }

    # ── NestJS API (:3001) ──────────────────────────────
    # 끝 슬래시로 /api/ 를 떼서 넘긴다 — Nest 컨트롤러에 prefix 가 없다.
    location /api/ {
        proxy_pass http://127.0.0.1:3001/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 업로드 정적 파일 ────────────────────────────────
    location /uploads/ {
        alias /var/www/Geniein/apps/web/public/uploads/;
        try_files $uri =404;
    }

    # ── Next 앱 본체 (:3000) ────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next 의 HMR·RSC 스트리밍용
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
